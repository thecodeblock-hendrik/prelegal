[project]
name = "prelegal-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "litellm>=1.102.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
